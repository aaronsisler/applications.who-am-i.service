application:
  persistence:
    database: auth
    schema: auth
    username: testuser
    password: testpass

# Used to disable logging during test run
logging:
  level:
    root: OFF
    # root: INFO # Shows logs from application
    org:
      springframework:
        jdbc.core: OFF
      # jdbc.core: DEBUG # Shows SQL statements
      testcontainers: OFF
      # testcontainers: INFO
spring:
  sql:
    init:
      mode: always # Run schema.sql on startup
springdoc:
  api-docs:
    # Disable Swagger API docs generation during tests
    enabled: false
