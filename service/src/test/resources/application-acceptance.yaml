application:
  persistence:
    password: testpass
    username: testuser

# Used to disable logging during test run
logging:
  level:
    #    root: OFF
    root: INFO
    org:
      springframework:
        #        jdbc.core: OFF
        jdbc.core: INFO
      testcontainers: OFF

server:
  url: http://localhost
  port: 8080

spring:
  sql:
    init:
      mode: always # Run schema.sql on startup

springdoc:
  api-docs:
    # Disable Swagger API docs generation during tests
    enabled: false
