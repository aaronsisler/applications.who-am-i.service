server:
  url: http://localhost
  port: 8080
# Used to disable logging during test run
logging:
  level:
    root: OFF
    org:
      springframework:
        jdbc.core: DEBUG # Shows SQL statements
      testcontainers: INFO
springdoc:
  api-docs:
    # Disable Swagger API docs generation during tests
    enabled: false

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: testuser
    password: testpass
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      #      mode: always # Run schema.sql on startup
      platform: postgresql