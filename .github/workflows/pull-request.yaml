# .github/workflows/pull-request.yaml
name: "Pull request"

on:
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "25"
          cache: "maven"
      - name: "Build and test"
        run: mvn --batch-mode --no-transfer-progress verify
